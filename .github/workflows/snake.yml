name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: noble20048
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00ffff&color_dots=#0d1117,#001a3d,#0047ab,#00bfff,#00ffff
            dist/github-snake.gif?palette=github-dark&color_snake=00f5d4&color_dots=#0d1117,#003d2e,#00a86b,#00f5d4,#ffffff&animate=true

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}